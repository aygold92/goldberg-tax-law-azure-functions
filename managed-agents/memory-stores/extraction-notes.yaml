# The name drives the mount path the skill reads: /mnt/memory/extraction-notes/
# Written by bank-statement-extraction; consolidated by memory-consolidation.
name: extraction-notes
description: >
  Bank statement extraction patterns and rules, including but not limited to: where the summary
  box and totals live, the register layout, sign and date conventions, multi-account structure,
  and known traps. One folder per bank type (e.g. /bank_of_america/), holding a consolidated
  main.md plus one file per session that has touched that bank. Read main.md and every session
  file in the folder; write only a new session file, never main.md.
