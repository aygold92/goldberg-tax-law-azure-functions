# Session-driven, one session per bank folder: the app fills user-prompt.md with the folder and the
# writing agent's memory-file format. It has no skill — the system prompt is the whole job.
name: memory-consolidation
model: claude-sonnet-5-5
description: >
  Tidies a per-bank memory store the extraction or splitting agents write to: merges each bank's
  per-session keyword files into its consolidated main.json, then deletes the session files it
  consumed.
system: {file: system-prompt.md}
tools:
  - {type: agent_toolset_20260401}
