# Deployment-driven: runs on a schedule with no per-run input, so it has a deployments/ entry
# rather than being started as a session. It has no skill — the system prompt is the whole job.
name: memory-consolidation
model: claude-opus-5
description: >
  Tidies a per-bank memory store the extraction or splitting agents write to: folds each bank's
  per-session files into its consolidated main.md, merging duplicate notes and recording
  conflicting ones as conflicts, then deletes the session files it consumed.
system: {file: system-prompt.md}
tools:
  - {type: agent_toolset_20260401}
