# The name drives the mount path the skill reads: /mnt/memory/bank-patterns/
# Written by bank-statement-splitting; consolidated by memory-consolidation.
name: bank-patterns
description: >
  Bank statement identification patterns and boundary detection rules. One folder per bank
  type (e.g. /bank_of_america/), holding a consolidated main.md plus one file per session
  that has touched that bank. Together they describe how to identify that bank and how to
  find statement boundaries within it. Read main.md and every session file in the folder;
  write only a new session file, never main.md.
